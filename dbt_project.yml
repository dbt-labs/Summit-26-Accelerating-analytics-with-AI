name: jaffle_shop 

profile: yda_summit

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

models:
  jaffle_shop:
    # Materialize staging models as views, and marts as tables
    +static_analysis: strict
    staging:
      +materialized: view
    marts:
      +materialized: table
  +state:
    lag_tolerance: "{{ '4h' if target.name == 'prod' else '7d' }}"
flags:
  require_generic_test_arguments_property: true
  manage_state: true