models:
  - name: mrt_daily_location_performance
    description: Daily store performance for manager reporting, with one row per location and order date. Revenue is pre-tax merchandise revenue; dates with no orders are not included.
    config:
      group: analytics_engineering
      meta:
        owner: analytics_engineering
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "abs(total_revenue - food_revenue - drink_revenue) < 0.01"
          description: Total pre-tax revenue should reconcile to the food and drink revenue components within one cent.
    columns:
      - name: daily_location_performance_id
        description: Surrogate key for the location and order date grain.
        data_tests:
          - not_null
          - unique
      - name: order_date
        description: Date on which the included orders were placed.
        data_tests:
          - not_null
      - name: location_id
        description: Store where the orders were placed.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('locations')
                field: location_id
      - name: location_name
        description: Reporting name of the store, included so managers can use the mart without a dimension join.
      - name: total_revenue
        description: Total pre-tax merchandise revenue from orders placed at the location on the date.
      - name: order_count
        description: Number of orders placed at the location on the date, including zero-value orders.
      - name: food_revenue
        description: Pre-tax revenue from products classified as food on orders placed at the location on the date.
      - name: drink_revenue
        description: Pre-tax revenue from products classified as drinks on orders placed at the location on the date.
