models:
  - name: daily_location_performance
    description: Daily store performance mart with one row per location per order date. Revenue is measured before tax so the food and drink components reconcile to total revenue.
    config:
      group: analytics_engineering
      meta:
        owner: analytics_engineering
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_date
              - location_id
      - dbt_utils.expression_is_true:
          arguments:
            expression: "total_revenue = food_revenue + drink_revenue"
    columns:
      - name: order_date
        description: The calendar date on which the included orders were placed.
        data_tests:
          - not_null
      - name: location_id
        description: The store associated with the day's orders.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('locations')
                field: location_id
      - name: location_name
        description: The store name used by managers to identify the location.
      - name: total_revenue
        description: Pre-tax revenue from all items sold by the location on the order date, in USD.
      - name: order_count
        description: Number of distinct orders placed at the location on the order date.
      - name: food_revenue
        description: Pre-tax revenue from food items sold by the location on the order date, in USD.
      - name: drink_revenue
        description: Pre-tax revenue from drink items sold by the location on the order date, in USD.
