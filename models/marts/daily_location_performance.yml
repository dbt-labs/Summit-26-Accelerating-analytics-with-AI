models:
  - name: daily_location_performance
    description: Daily store performance mart at one row per location per order date. Revenue is pre-tax item revenue in USD, split into mutually exclusive food and drink categories.
    config:
      group: analytics_engineering
      meta:
        owner: analytics_engineering
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "total_revenue = food_revenue + drink_revenue"
    columns:
      - name: daily_location_performance_key
        description: Generated primary key for the combination of order date and location.
        data_tests:
          - not_null
          - unique
      - name: order_date
        description: Calendar date on which the location accepted the orders included in these metrics.
        data_tests:
          - not_null
      - name: location_id
        description: Foreign key for the store location represented by this row.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('locations')
                field: location_id
      - name: location_name
        description: Store name included for manager-facing reporting without requiring a separate location join.
      - name: count_orders
        description: Number of orders accepted by the location on the order date.
      - name: total_revenue
        description: Pre-tax item revenue in USD; equals food revenue plus drink revenue.
      - name: food_revenue
        description: Pre-tax revenue in USD from products classified as food items.
      - name: drink_revenue
        description: Pre-tax revenue in USD from products classified as drink items.
