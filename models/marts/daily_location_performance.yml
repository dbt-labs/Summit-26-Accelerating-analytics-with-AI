models:
  - name: daily_location_performance
    description: Daily store performance for manager reporting, with one row per order date and location. Revenue represents merchandise sales before tax and is split between food and drink items.
    config:
      group: analytics_engineering
      meta:
        owner: analytics_engineering
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "total_revenue = food_revenue + drink_revenue"
    columns:
      - name: daily_location_id
        description: Surrogate key for the order date and location grain.
        data_tests:
          - not_null
          - unique
      - name: order_date
        description: Date on which the included orders were placed.
        data_tests:
          - not_null
      - name: location_id
        description: Store where the included orders were placed.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('locations')
                field: location_id
      - name: location_name
        description: Manager-facing store name from the locations mart.
      - name: order_count
        description: Number of distinct orders placed at the location on the date.
      - name: total_revenue
        description: Merchandise revenue before tax from all food and drink items sold at the location on the date.
      - name: food_revenue
        description: Portion of merchandise revenue from products categorized as food.
      - name: drink_revenue
        description: Portion of merchandise revenue from products categorized as drinks.
