models:
  - name: daily_location_performance
    description: Daily store performance for manager reporting, with one row per location and order date where at least one order was placed. Revenue is pre-tax merchandise revenue so the food and drink components reconcile to the total.
    config:
      group: analytics_engineering
      meta:
        owner: analytics_engineering
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "total_revenue = food_revenue + drink_revenue"
    columns:
      - name: daily_location_id
        description: Surrogate key for the location and order date grain.
        data_tests:
          - not_null
          - unique
      - name: order_date
        description: Date on which the included orders were placed.
        data_tests:
          - not_null
      - name: location_id
        description: Store where the orders were placed.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('locations')
                field: location_id
      - name: location_name
        description: Manager-facing store name from the locations mart.
      - name: total_revenue
        description: Total pre-tax merchandise revenue in USD, including zero-dollar orders.
      - name: order_count
        description: Number of orders placed at the location on the order date, including zero-dollar orders.
      - name: food_revenue
        description: Pre-tax merchandise revenue in USD from products classified as food.
      - name: drink_revenue
        description: Pre-tax merchandise revenue in USD from products classified as drinks.
