models:
  - name: daily_location_performance
    description: Daily store performance for manager reporting, with one row per order date and location. Revenue is pre-tax merchandise revenue so total revenue reconciles to the food and drink breakdown; dates without orders are not included.
    config:
      group: analytics_engineering
      meta:
        owner: analytics_engineering
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "total_revenue = food_revenue + drink_revenue"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "order_count > 0 and total_revenue >= 0 and food_revenue >= 0 and drink_revenue >= 0"
    columns:
      - name: daily_location_id
        description: Surrogate key for the order date and location grain.
        data_tests:
          - not_null
          - unique
      - name: order_date
        description: Calendar date on which the orders were placed.
        data_tests:
          - not_null
      - name: location_id
        description: Store associated with the orders included in the daily totals.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('locations')
                field: location_id
      - name: location_name
        description: Manager-facing store name from the locations mart.
        data_tests:
          - not_null
      - name: order_count
        description: Number of orders placed at the location on the order date.
      - name: total_revenue
        description: Pre-tax merchandise revenue from all orders at the location on the order date, in USD.
      - name: food_revenue
        description: Portion of total revenue attributable to products classified as food, in USD.
      - name: drink_revenue
        description: Portion of total revenue attributable to products classified as drinks, in USD.
