models:
  - name: daily_location_performance
    description: Daily store performance for manager reporting, with one row per location per order date. Revenue is pre-tax order subtotal and is split by food and drink item sales; zero-value orders without items remain included in the order count.
    config:
      group: analytics_engineering
      meta:
        owner: analytics_engineering
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "total_revenue = food_revenue + drink_revenue"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "count_orders > 0"
    columns:
      - name: daily_location_performance_key
        description: Surrogate primary key generated from the order date and location ID.
        data_tests:
          - not_null
          - unique
      - name: order_date
        description: Date on which the included orders were placed.
        data_tests:
          - not_null
      - name: location_id
        description: Store location associated with the daily performance totals.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('locations')
                field: location_id
      - name: location_name
        description: Manager-facing store name from the locations mart.
      - name: total_revenue
        description: Total pre-tax order subtotal in USD, including zero-value orders.
      - name: count_orders
        description: Number of orders placed at the location on the order date, including zero-value orders without items.
      - name: food_revenue
        description: Portion of total pre-tax revenue from products classified as food.
      - name: drink_revenue
        description: Portion of total pre-tax revenue from products classified as drinks.
