models:
  - name: daily_location_performance
    description: |
      Daily sales performance for store managers, with one row per location per
      order date. Revenue is pretax item revenue in USD so total revenue
      reconciles directly to the food and drink revenue components.
    config:
      group: analytics_engineering
      meta:
        owner: analytics_engineering
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "total_revenue = food_revenue + drink_revenue"
          description: Every product is classified as either food or drink, so the revenue split must reconcile to total pretax revenue.
    columns:
      - name: daily_location_id
        description: Surrogate key for the combination of order date and location.
        data_tests:
          - not_null
          - unique
      - name: order_date
        description: Calendar date on which the included orders were placed.
        data_tests:
          - not_null
      - name: location_id
        description: Store location associated with the orders.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('locations')
                field: location_id
      - name: location_name
        description: Manager-facing store name from the locations mart.
        data_tests:
          - not_null
      - name: order_count
        description: Number of orders placed at the location on the order date, including orders with no item revenue.
      - name: total_revenue
        description: Pretax item revenue in USD, sourced from order subtotal so it reconciles to food and drink revenue.
      - name: food_revenue
        description: Pretax revenue in USD from products classified as food.
      - name: drink_revenue
        description: Pretax revenue in USD from products classified as drinks.
