models:
  - name: daily_location_performance
    description: Daily store performance for manager reporting, with one row per location per order date. Revenue is pre-tax merchandise revenue so the food and drink components reconcile to the total; zero-revenue orders are retained in the order count.
    config:
      group: analytics_engineering
      meta:
        owner: analytics_engineering
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "total_revenue = food_revenue + drink_revenue"
    columns:
      - name: daily_location_id
        description: Surrogate key generated from the location and order date at the model's daily location grain.
        data_tests:
          - not_null
          - unique
      - name: order_date
        description: Calendar date on which the included orders were placed.
        data_tests:
          - not_null
      - name: location_id
        description: Store associated with the day's orders.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('locations')
                field: location_id
      - name: location_name
        description: Manager-facing store name from the locations mart.
        data_tests:
          - not_null
      - name: total_revenue
        description: Sum of pre-tax order subtotals in USD for the location and date.
      - name: order_count
        description: Number of orders placed at the location on the date, including zero-revenue orders.
      - name: food_revenue
        description: Pre-tax revenue in USD from products categorized as food.
      - name: drink_revenue
        description: Pre-tax revenue in USD from products categorized as drinks.
