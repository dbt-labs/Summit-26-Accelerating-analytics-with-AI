models:
  - name: daily_location_performance
    description: |
      Daily sales performance for store managers, with one row per order date and location that had at least one order.
      Revenue is measured before tax and split into food and drink sales; zero-dollar orders remain included in count_orders.
    config:
      group: analytics_engineering
      meta:
        owner: analytics_engineering
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "total_revenue = food_revenue + drink_revenue"
    columns:
      - name: daily_location_performance_key
        description: Generated primary key for the order_date and location_id combination that defines the model grain.
        data_tests:
          - not_null
          - unique
      - name: order_date
        description: Calendar date on which the location's orders were placed.
        data_tests:
          - not_null
      - name: location_id
        description: Store location associated with the day's orders.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('locations')
                field: location_id
      - name: location_name
        description: Manager-facing store name from the locations mart.
        data_tests:
          - not_null
      - name: total_revenue
        description: Total pre-tax order revenue in USD, including food and drink sales.
      - name: count_orders
        description: Number of orders placed at the location on the order date, including any zero-dollar orders.
      - name: food_revenue
        description: Pre-tax revenue in USD from products classified as food (jaffles).
      - name: drink_revenue
        description: Pre-tax revenue in USD from products classified as drinks (beverages).
