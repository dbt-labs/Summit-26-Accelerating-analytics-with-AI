models:
  - name: daily_location_performance
    description: >
      Daily operating performance for store managers, with one row per location
      per calendar date in the available order window. Dates before a location
      opened are excluded; dates with no orders are included with zero-valued
      metrics. Revenue is pre-tax merchandise revenue, so total revenue equals
      food revenue plus drink revenue.
    config:
      group: analytics_engineering
      meta:
        owner: analytics_engineering
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "total_revenue = food_revenue + drink_revenue"
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              order_count >= 0
              and total_revenue >= 0
              and food_revenue >= 0
              and drink_revenue >= 0
    columns:
      - name: daily_location_performance_id
        description: Surrogate key for the location and order date grain.
        data_tests:
          - not_null
          - unique
      - name: order_date
        description: Calendar date used to report location performance.
        data_tests:
          - not_null
      - name: location_id
        description: Store identifier used to join performance to the locations mart.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('locations')
                field: location_id
      - name: location_name
        description: Manager-facing store name from the locations mart.
        data_tests:
          - not_null
      - name: order_count
        description: Number of orders placed at the location on the date, including zero-subtotal orders.
        data_tests:
          - not_null
      - name: total_revenue
        description: Pre-tax merchandise revenue in USD; equal to food revenue plus drink revenue.
        data_tests:
          - not_null
      - name: food_revenue
        description: Pre-tax merchandise revenue in USD from products classified as food.
        data_tests:
          - not_null
      - name: drink_revenue
        description: Pre-tax merchandise revenue in USD from products classified as drinks.
        data_tests:
          - not_null
