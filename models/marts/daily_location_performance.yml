models:
  - name: daily_location_performance
    description: |
      Daily store performance for location-level reporting, with one row per
      order date and location that recorded at least one order. Revenue is
      pre-tax merchandise revenue, split between food and drink products.
      Orders without line items remain included in count_orders with zero
      food and drink revenue.
    config:
      group: analytics_engineering
      meta:
        owner: analytics_engineering
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "total_revenue = food_revenue + drink_revenue"
    columns:
      - name: daily_location_performance_key
        description: Surrogate primary key generated from order_date and location_id.
        data_tests:
          - not_null
          - unique
      - name: order_date
        description: Calendar date on which the included orders were placed.
        data_tests:
          - not_null
      - name: location_id
        description: Store where the orders were placed.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('locations')
                field: location_id
      - name: location_name
        description: Reporting name of the store from the locations mart.
      - name: total_revenue
        description: Total pre-tax merchandise revenue from orders placed at the location on the date.
      - name: count_orders
        description: Number of orders placed at the location on the date, including orders without line items.
      - name: food_revenue
        description: Pre-tax merchandise revenue from products classified as food.
      - name: drink_revenue
        description: Pre-tax merchandise revenue from products classified as drinks.
