models:
  - name: daily_location_performance
    description: One row per location per order date, summarizing pre-tax merchandise revenue and order volume for days when the location had orders. Food and drink revenue reconcile to total revenue because taxes are excluded.
    config:
      group: analytics_engineering
      meta:
        owner: analytics_engineering
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "total_revenue = food_revenue + drink_revenue"
    columns:
      - name: daily_location_performance_id
        description: Stable surrogate key for the combination of order date and location.
        data_tests:
          - not_null
          - unique
      - name: order_date
        description: Calendar date on which the included orders were placed.
        data_tests:
          - not_null
      - name: location_id
        description: Location where the included orders were placed.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('locations')
                field: location_id
      - name: location_name
        description: Manager-facing name of the location as recorded in the locations mart.
        data_tests:
          - not_null
      - name: order_count
        description: Number of distinct orders placed at the location on the order date.
        data_tests:
          - not_null
      - name: total_revenue
        description: Pre-tax merchandise revenue from all order items at the location on the order date.
        data_tests:
          - not_null
      - name: food_revenue
        description: Portion of pre-tax merchandise revenue generated by food items.
        data_tests:
          - not_null
      - name: drink_revenue
        description: Portion of pre-tax merchandise revenue generated by drink items.
        data_tests:
          - not_null
